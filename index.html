<meta name="description" content="Beat the 2 PM Slump: wake Ollo, find your Qalloo Energy flavour and unlock code SLUMP5. Student campaign concept.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF9EC}
a{color:#10204A}a:hover{color:#0A6FB0}
@keyframes qShakeA{0%{transform:rotate(0)}20%{transform:rotate(-9deg) translateY(-6px)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg) translateY(-4px)}80%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes qShakeB{0%{transform:rotate(0)}20%{transform:rotate(9deg) translateY(-6px)}40%{transform:rotate(-8deg)}60%{transform:rotate(6deg) translateY(-4px)}80%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
@keyframes qBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes qPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes qIn{0%{transform:translateX(40px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes qZzz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(18px,-40px);opacity:0}}
.q-shakeA{animation:qShakeA .5s ease}
.q-shakeB{animation:qShakeB .5s ease}
.q-awake{animation:qBob 2.4s ease-in-out infinite}
.q-pop{animation:qPop .45s ease-out both}
.q-in{animation:qIn .4s ease-out both}
.q-zzz{animation:qZzz 2.2s ease-in infinite}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: 'DM Sans', system-ui, sans-serif; color: #10204A; background: #FFF9EC; width: 100%; min-height: 100vh; overflow-x: clip; display: flex; flex-direction: column">

  <!-- STICKY TOP: brand + journey progress -->
  <header style="position: sticky; top: 0; z-index: 20; background: rgba(255, 249, 236, 0.97); border-bottom: 1px solid #F1E6CC">
    <div style="max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <button type="button" onClick="{{goWake}}" style="font: inherit; cursor: pointer; background: transparent; border: 0; padding: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px; color: #10204A">qalloo</button>
      <ol aria-label="Your progress" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <li>
            <button type="button" onClick="{{s.go}}" disabled="{{s.locked}}" aria-current="{{s.current}}" style="font: inherit; cursor: {{s.cursor}}; border: 0; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 999px; font-weight: 700; font-size: 14px; background: {{s.bg}}; color: {{s.fg}}; opacity: {{s.opacity}}">
              <span style="width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{s.dotBg}}; color: {{s.dotFg}}; font-size: 14px">{{s.mark}}</span>
              {{s.label}}
            </button>
          </li>
        </sc-for>
      </ol>
    </div>
  </header>

  <!-- ================= SCREEN 1: WAKE OLLO ================= -->
  <sc-if value="{{isWake}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1 0 auto; display: flex; flex-direction: column">
      <div style="background: #10204A; color: #FFFFFF; text-align: center; padding: 10px 20px; font-size: 15px; font-weight: 500">{{sourceLine}}</div>
      <section style="flex: 1 0 auto; background: {{heroBg}}; color: {{heroFg}}; transition: background .5s ease, color .5s ease">
        <div style="max-width: 1200px; margin: 0 auto; padding: 56px 20px 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 40px">
          <div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
            <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; background: {{clockBg}}; color: {{clockFg}}; font-weight: 700; font-size: 15px; padding: 8px 16px; border-radius: 999px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
              {{timeLine}}
            </span>
            <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: clamp(46px, 7vw, 84px); line-height: 0.98; letter-spacing: -1.5px">{{headline}}</h1>
            <p style="margin: 0; font-size: 20px; line-height: 1.5; max-width: 500px">{{subline}}</p>

            <sc-if value="{{asleep}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; gap: 14px; max-width: 460px">
                <button type="button" onClick="{{shake}}" style="font: inherit; cursor: pointer; border: 0; background: #FFD84D; color: #10204A; font-weight: 700; font-size: 20px; padding: 20px 28px; border-radius: 999px; box-shadow: 0 6px 0 #0B1533; display: flex; align-items: center; justify-content: center; gap: 12px">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"></path><path d="M10 3v3l-2 3v11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V9l-2-3V3"></path><path d="M8 13h8"></path></svg>
                  {{shakeLabel}}
                </button>
                <span style="font-size: 15px; opacity: 0.85">Tap to shake the bottle. Every shake mixes in a bit more Qalloo Energy.</span>
              </div>
            </sc-if>
            <sc-if value="{{awake}}" hint-placeholder-val="{{ false }}">
              <div class="q-pop" style="display: flex; flex-direction: column; gap: 12px; max-width: 480px">
                <button type="button" onClick="{{goQuiz}}" style="font: inherit; cursor: pointer; border: 0; background: #10204A; color: #FFFFFF; font-weight: 700; font-size: 20px; padding: 20px 28px; border-radius: 999px; box-shadow: 0 6px 0 rgba(16, 32, 74, 0.35); display: flex; align-items: center; justify-content: center; gap: 12px">
                  Get Ollo's secret
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
                </button>
                <span style="font-size: 15px; font-weight: 500">3 quick taps to find your flavour. Code SLUMP5 is waiting at the end.</span>
              </div>
            </sc-if>

            <div style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 15px; font-weight: 500; opacity: 0.9">
              <span><strong>4.77/5</strong> from 7,000+ reviews</span>
              <span><strong>50,000+</strong> customers</span>
              <span>Backed by <strong>Spadel</strong> (SPA, Bru)</span>
            </div>
          </div>

          <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 20px">
            <div style="position: relative; width: 100%; max-width: 460px; height: 380px; display: flex; align-items: flex-end; justify-content: center; gap: 12px">
              <div style="position: absolute; left: 50%; top: 50%; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%; background: {{haloBg}}; transition: background .5s ease"></div>
              <sc-if value="{{asleep}}" hint-placeholder-val="{{ true }}">
                <span class="q-zzz" aria-hidden="true" style="position: absolute; top: 40px; left: 52%; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 34px; color: #7FD6FF">z</span>
              </sc-if>
              <img class="{{olloClass}}" src="{{olloImg}}" alt="{{olloAlt}}" style="position: relative; width: 270px; height: 270px; object-fit: contain; filter: {{olloFilter}}">
              <svg class="{{bottleClass}}" width="96" height="230" viewBox="0 0 96 230" role="img" aria-label="Water bottle filling with Qalloo Energy" style="position: relative; flex: none">
                <rect x="34" y="4" width="28" height="22" rx="5" fill="#10204A"></rect>
                <rect x="12" y="30" width="72" height="194" rx="22" fill="#FFFFFF" stroke="#10204A" stroke-width="4"></rect>
                <rect x="16" y="{{liquidY}}" width="64" height="{{liquidH}}" rx="18" fill="{{liquidColor}}"></rect>
                <rect x="24" y="52" width="8" height="120" rx="4" fill="#FFFFFF" opacity="0.6"></rect>
              </svg>
            </div>
            <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 15px">
                <span>Ollo's afternoon battery</span>
                <span>{{energyPct}}</span>
              </div>
              <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{energy}}" aria-label="Ollo's afternoon battery" style="height: 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.25); border: 2px solid {{heroFg}}; overflow: hidden">
                <div style="height: 100%; width: {{energyPct}}; background: {{meterColor}}; border-radius: 999px; transition: width .35s ease"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section style="background: #10204A; color: #FFFFFF">
        <div style="max-width: 1200px; margin: 0 auto; padding: 24px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 21px">
          <span>"Still three lectures to go?"</span>
          <span style="color: #FFD84D">"Lunch over. Your day isn't."</span>
          <span>"Third coffee, really?"</span>
        </div>
      </section>
    </div>
  </sc-if>

  <!-- ================= SCREEN 2: FLAVOUR QUIZ ================= -->
  <sc-if value="{{isQuiz}}" hint-placeholder-val="{{ false }}">
    <section class="q-in" style="flex: 1 0 auto; background: #FFF9EC">

      bottleClass: !awake && s.energy > 12 ? (s.flip ? 'q-shakeB' : 'q-shakeA') : '',
      olloFilter: awake ? 'none' : 'saturate(' + (0.45 + 0.55 * t).toFixed(2) + ') brightness(' + (0.85 + 0.15 * t).toFixed(2) + ')',
      liquidH: Math.round(150 * Math.max(0.15, t)),
      liquidY: 220 - Math.round(150 * Math.max(0.15, t)),
      liquidColor: this.mix('#CFEFFF', '#FFC233', t),
      shakeLabel: e <= 12 ? 'Shake to wake Ollo' : 'Keep shaking (' + shakesLeft + ' more)',
      shake: shakeFn,

      quizTitle: quizDone ? 'Ollo’s secret, matched to you.' : 'Ollo’s about to share his secret.',
      quizOpen: !quizDone, quizDone: quizDone,
      qNum: qi + 1, qProgress: Math.round(((qi + 1) / 3) * 100) + '%',
      question: question,
      backLabel: qi > 0 ? 'Previous question' : 'Back to Ollo',
      back: function () { if (qi === 0) { self.go('wake'); } else { self.setState({ q: qi - 1, answers: s.answers.slice(0, qi - 1) }); } },
      restartQuiz: function () { self.setState({ q: 0, answers: [], copied: false, viewFlav: null }); },
      result: result, swapLine: SWAP[s.answers[1]] || SWAP.none, flavour: flavour,

      flavourTabs: flavourTabs, view: view, viewIsOther: viewId !== matchId,
      matchImg: PACK[matchId].img, matchBg: PACK[matchId].bg, comboImg: PACK.all.img,
      backToMatch: function () { self.setState({ viewFlav: null }); },
      copyLabel: s.copied ? 'Copied' : 'Copy code',
      copyCode: function () { try { navigator.clipboard.writeText('SLUMP5'); } catch (err) {} self.setState({ copied: true }); },
      daysLeft: daysLeft,

      faqs: faqs,
      shareLabel: s.shared ? 'Link copied, go tag them' : 'Share my ' + result.name + ' result',
      share: function () { try { navigator.clipboard.writeText('[campaign landing page URL]'); } catch (err) {} self.setState({ shared: true }); },

      steps: steps,
      barText: barText, barCta: barCta, barGo: barGo
    };
  }
}
</script>
<script>
// ---- page settings from the link: ?src=tiktok | ?src=booth  and  ?time=14:05 for demos ----
(function () {
  var q = new URLSearchParams(location.search);
  var srcMap = { instagram: 'Instagram Reel', tiktok: 'TikTok', booth: 'Campus booth QR' };
  var props = { source: srcMap[(q.get('src') || '').toLowerCase()] || 'Instagram Reel', clock: q.get('time') || 'Live' };
  window.__mount(Component, props);
})();
</script>
