<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat the 2 PM Slump with Qalloo Energy</title>
<link rel="icon" type="image/png" href="images/ollo-energy.png">
<meta name="description" content="Beat the 2 PM Slump: wake Ollo, find your Qalloo Energy flavour and unlock code SLUMP5. Student campaign concept.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF9EC}
a{color:#10204A}a:hover{color:#0A6FB0}
@keyframes qShakeA{0%{transform:rotate(0)}20%{transform:rotate(-9deg) translateY(-6px)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg) translateY(-4px)}80%{transform:rotate(4deg)}100%{transform:rotate(0)}}
@keyframes qShakeB{0%{transform:rotate(0)}20%{transform:rotate(9deg) translateY(-6px)}40%{transform:rotate(-8deg)}60%{transform:rotate(6deg) translateY(-4px)}80%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
@keyframes qBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes qPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes qIn{0%{transform:translateX(40px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes qZzz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(18px,-40px);opacity:0}}
.q-shakeA{animation:qShakeA .5s ease}
.q-shakeB{animation:qShakeB .5s ease}
.q-awake{animation:qBob 2.4s ease-in-out infinite}
.q-pop{animation:qPop .45s ease-out both}
.q-in{animation:qIn .4s ease-out both}
.q-zzz{animation:qZzz 2.2s ease-in infinite}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: 'DM Sans', system-ui, sans-serif; color: #10204A; background: #FFF9EC; width: 100%; min-height: 100vh; overflow-x: clip; display: flex; flex-direction: column">

  <!-- STICKY TOP: brand + journey progress -->
  <header style="position: sticky; top: 0; z-index: 20; background: rgba(255, 249, 236, 0.97); border-bottom: 1px solid #F1E6CC">
    <div style="max-width: 1200px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <button type="button" onClick="{{goWake}}" style="font: inherit; cursor: pointer; background: transparent; border: 0; padding: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px; color: #10204A">qalloo</button>
      <ol aria-label="Your progress" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <li>
            <button type="button" onClick="{{s.go}}" disabled="{{s.locked}}" aria-current="{{s.current}}" style="font: inherit; cursor: {{s.cursor}}; border: 0; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 999px; font-weight: 700; font-size: 14px; background: {{s.bg}}; color: {{s.fg}}; opacity: {{s.opacity}}">
              <span style="width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{s.dotBg}}; color: {{s.dotFg}}; font-size: 14px">{{s.mark}}</span>
              {{s.label}}
            </button>
          </li>
        </sc-for>
      </ol>
    </div>
  </header>

  <!-- ================= SCREEN 1: WAKE OLLO ================= -->
  <sc-if value="{{isWake}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1 0 auto; display: flex; flex-direction: column">
      <div style="background: #10204A; color: #FFFFFF; text-align: center; padding: 10px 20px; font-size: 15px; font-weight: 500">{{sourceLine}}</div>
      <section style="flex: 1 0 auto; background: {{heroBg}}; color: {{heroFg}}; transition: background .5s ease, color .5s ease">
        <div style="max-width: 1200px; margin: 0 auto; padding: 56px 20px 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 40px">
          <div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
            <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; background: {{clockBg}}; color: {{clockFg}}; font-weight: 700; font-size: 15px; padding: 8px 16px; border-radius: 999px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
              {{timeLine}}
            </span>
            <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: clamp(46px, 7vw, 84px); line-height: 0.98; letter-spacing: -1.5px">{{headline}}</h1>
            <p style="margin: 0; font-size: 20px; line-height: 1.5; max-width: 500px">{{subline}}</p>

            <sc-if value="{{asleep}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; flex-direction: column; gap: 14px; max-width: 460px">
                <button type="button" onClick="{{shake}}" style="font: inherit; cursor: pointer; border: 0; background: #FFD84D; color: #10204A; font-weight: 700; font-size: 20px; padding: 20px 28px; border-radius: 999px; box-shadow: 0 6px 0 #0B1533; display: flex; align-items: center; justify-content: center; gap: 12px">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"></path><path d="M10 3v3l-2 3v11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V9l-2-3V3"></path><path d="M8 13h8"></path></svg>
                  {{shakeLabel}}
                </button>
                <span style="font-size: 15px; opacity: 0.85">Tap to shake the bottle. Every shake mixes in a bit more Qalloo Energy.</span>
              </div>
            </sc-if>
            <sc-if value="{{awake}}" hint-placeholder-val="{{ false }}">
              <div class="q-pop" style="display: flex; flex-direction: column; gap: 12px; max-width: 480px">
                <button type="button" onClick="{{goQuiz}}" style="font: inherit; cursor: pointer; border: 0; background: #10204A; color: #FFFFFF; font-weight: 700; font-size: 20px; padding: 20px 28px; border-radius: 999px; box-shadow: 0 6px 0 rgba(16, 32, 74, 0.35); display: flex; align-items: center; justify-content: center; gap: 12px">
                  Get Ollo's secret
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
                </button>
                <span style="font-size: 15px; font-weight: 500">3 quick taps to find your flavour. Code SLUMP5 is waiting at the end.</span>
              </div>
            </sc-if>

            <div style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 15px; font-weight: 500; opacity: 0.9">
              <span><strong>4.77/5</strong> from 7,000+ reviews</span>
              <span><strong>50,000+</strong> customers</span>
              <span>Backed by <strong>Spadel</strong> (SPA, Bru)</span>
            </div>
          </div>

          <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 20px">
            <div style="position: relative; width: 100%; max-width: 460px; height: 380px; display: flex; align-items: flex-end; justify-content: center; gap: 12px">
              <div style="position: absolute; left: 50%; top: 50%; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%; background: {{haloBg}}; transition: background .5s ease"></div>
              <sc-if value="{{asleep}}" hint-placeholder-val="{{ true }}">
                <span class="q-zzz" aria-hidden="true" style="position: absolute; top: 40px; left: 52%; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 34px; color: #7FD6FF">z</span>
              </sc-if>
              <img class="{{olloClass}}" src="{{olloImg}}" alt="{{olloAlt}}" style="position: relative; width: 270px; height: 270px; object-fit: contain; filter: {{olloFilter}}">
              <svg class="{{bottleClass}}" width="96" height="230" viewBox="0 0 96 230" role="img" aria-label="Water bottle filling with Qalloo Energy" style="position: relative; flex: none">
                <rect x="34" y="4" width="28" height="22" rx="5" fill="#10204A"></rect>
                <rect x="12" y="30" width="72" height="194" rx="22" fill="#FFFFFF" stroke="#10204A" stroke-width="4"></rect>
                <rect x="16" y="{{liquidY}}" width="64" height="{{liquidH}}" rx="18" fill="{{liquidColor}}"></rect>
                <rect x="24" y="52" width="8" height="120" rx="4" fill="#FFFFFF" opacity="0.6"></rect>
              </svg>
            </div>
            <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 15px">
                <span>Ollo's afternoon battery</span>
                <span>{{energyPct}}</span>
              </div>
              <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{energy}}" aria-label="Ollo's afternoon battery" style="height: 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.25); border: 2px solid {{heroFg}}; overflow: hidden">
                <div style="height: 100%; width: {{energyPct}}; background: {{meterColor}}; border-radius: 999px; transition: width .35s ease"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section style="background: #10204A; color: #FFFFFF">
        <div style="max-width: 1200px; margin: 0 auto; padding: 24px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 21px">
          <span>"Still three lectures to go?"</span>
          <span style="color: #FFD84D">"Lunch over. Your day isn't."</span>
          <span>"Third coffee, really?"</span>
        </div>
      </section>
    </div>
  </sc-if>

  <!-- ================= SCREEN 2: FLAVOUR QUIZ ================= -->
  <sc-if value="{{isQuiz}}" hint-placeholder-val="{{ false }}">
    <section class="q-in" style="flex: 1 0 auto; background: #FFF9EC">
      <div style="max-width: 860px; margin: 0 auto; padding: 56px 20px 80px; display: flex; flex-direction: column; gap: 28px">
        <div style="display: flex; align-items: center; gap: 20px">
          <img src="images/ollo-energy.png" alt="" aria-hidden="true" class="q-awake" style="width: 96px; height: 96px; object-fit: contain; flex: none">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="color: #C2410C; font-weight: 700; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase">Step 2 · Your flavour</span>
            <h2 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: clamp(32px, 4.5vw, 48px); line-height: 1.05">{{quizTitle}}</h2>
          </div>
        </div>

        <sc-if value="{{quizOpen}}" hint-placeholder-val="{{ true }}">
          <div class="q-in" style="background: #FFFFFF; border: 3px solid #10204A; border-radius: 32px; padding: 32px; box-shadow: 0 8px 0 #10204A; display: flex; flex-direction: column; gap: 24px">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
              <span style="font-weight: 700; font-size: 15px">Question {{qNum}} of 3</span>
              <div style="flex: 1 1 auto; max-width: 260px; height: 10px; background: #F1E6CC; border-radius: 999px; overflow: hidden">
                <div style="height: 100%; width: {{qProgress}}; background: #FF9A5B; border-radius: 999px; transition: width .3s ease"></div>
              </div>
            </div>
            <h3 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 30px; line-height: 1.15">{{question.title}}</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
              <sc-for list="{{question.options}}" as="o" hint-placeholder-count="4">
                <button type="button" onClick="{{o.pick}}" style="font: inherit; cursor: pointer; text-align: left; background: #FFF9EC; color: #10204A; border: 2px solid #F1E6CC; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
                  <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 21px">{{o.label}}</span>
                  <span style="font-size: 15px; color: #4A5578">{{o.hint}}</span>
                </button>
              </sc-for>
            </div>
            <button type="button" onClick="{{back}}" style="font: inherit; cursor: pointer; align-self: flex-start; background: transparent; border: 0; color: #10204A; font-weight: 700; font-size: 15px; text-decoration: underline; padding: 10px 0">{{backLabel}}</button>
          </div>
        </sc-if>

        <sc-if value="{{quizDone}}" hint-placeholder-val="{{ false }}">
          <div class="q-pop" style="background: #10204A; color: #FFFFFF; border-radius: 32px; padding: 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
            <img src="{{result.img}}" alt="{{result.name}}" style="width: 170px; height: 170px; object-fit: contain; background: #FFF9EC; border-radius: 50%; padding: 14px; box-sizing: border-box">
            <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
              <span style="color: #FFD84D; font-weight: 700; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase">You're {{result.name}}</span>
              <h3 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 32px; line-height: 1.1">{{result.headline}}</h3>
              <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #D6DDF0">{{swapLine}}</p>
              <p style="margin: 0; font-size: 17px; line-height: 1.55">Your flavour match: <strong style="color: #FFD84D">{{flavour}}</strong></p>
            </div>
            <img src="{{matchImg}}" alt="Qalloo Energy {{flavour}} box" style="width: 170px; height: 170px; object-fit: contain; border-radius: 24px; background: {{matchBg}}">
            <div style="flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid #2B3E78; padding-top: 22px">
              <span style="font-weight: 700; font-size: 16px">Code unlocked:</span>
              <span style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 2px; background: #FFD84D; color: #10204A; padding: 6px 16px; border-radius: 12px">SLUMP5</span>
              <button type="button" onClick="{{restartQuiz}}" style="font: inherit; cursor: pointer; background: transparent; border: 0; color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: underline; padding: 10px 0">Retake</button>
              <button type="button" onClick="{{goPack}}" style="margin-left: auto; font: inherit; cursor: pointer; border: 0; background: #FFD84D; color: #10204A; font-weight: 700; font-size: 18px; padding: 16px 26px; border-radius: 999px; display: flex; align-items: center; gap: 10px">
                See my pack
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
              </button>
            </div>
          </div>
        </sc-if>
      </div>
    </section>
  </sc-if>

  <!-- ================= SCREEN 3: YOUR PACK ================= -->
  <sc-if value="{{isPack}}" hint-placeholder-val="{{ false }}">
    <section class="q-in" style="flex: 1 0 auto; background: #FFD84D">
      <div style="max-width: 1200px; margin: 0 auto; padding: 56px 20px 80px; display: flex; flex-direction: column; gap: 32px">
        <div style="display: flex; flex-wrap: wrap; align-items: stretch; gap: 32px">
          <div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
            <span style="font-weight: 700; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase">Step 3 · Picked for {{result.name}}</span>
            <h2 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: clamp(36px, 4.8vw, 56px); line-height: 1.02">Your Energy Starter Pack is ready.</h2>
            <p style="margin: 0; font-size: 18px; line-height: 1.55">16 sachets, all four Energy flavours. That's 16 afternoons to find out which one is really yours, at about €1.53 a slump.</p>
            <div style="display: flex; flex-direction: column; gap: 12px">
              <span style="font-weight: 700; font-size: 15px">Compare the flavours in your pack:</span>
              <div role="tablist" aria-label="Energy flavours" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px">
                <sc-for list="{{flavourTabs}}" as="f" hint-placeholder-count="4">
                  <button type="button" role="tab" aria-selected="{{f.selected}}" onClick="{{f.pick}}" style="font: inherit; cursor: pointer; text-align: left; color: #10204A; background: {{f.bg}}; border: {{f.border}}; box-shadow: {{f.shadow}}; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-height: 44px">
                    <span style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px">
                      <span style="width: 18px; height: 18px; border-radius: 50%; background: {{f.dot}}; border: 2px solid #10204A; flex: none"></span>
                      {{f.name}}
                    </span>
                    <sc-if value="{{f.match}}" hint-placeholder-val="{{ false }}">
                      <span style="align-self: flex-start; background: #10204A; color: #FFD84D; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 4px 8px; border-radius: 999px">Your match</span>
                    </sc-if>
                  </button>
                </sc-for>
              </div>
              <div class="q-pop" style="background: #FFFFFF; border: 2px solid #10204A; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
                <span style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 24px">{{view.name}}</span>
                <span style="font-size: 16px; line-height: 1.5">{{view.desc}}</span>
                <sc-if value="{{viewIsOther}}" hint-placeholder-val="{{ false }}">
                  <button type="button" onClick="{{backToMatch}}" style="font: inherit; cursor: pointer; align-self: flex-start; background: transparent; border: 0; padding: 8px 0; color: #10204A; font-weight: 700; font-size: 15px; text-decoration: underline">Back to my match: {{flavour}}</button>
                </sc-if>
              </div>
              <span style="font-size: 14px; font-weight: 500">All four flavours are in the Starter Pack, 4 sachets each.</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 15px; font-weight: 500">
              <span><strong>80 mg</strong> natural caffeine</span>
              <span><strong>Sugar-free</strong></span>
              <span><strong>7</strong> kcal</span>
              <span><strong>8</strong> B vitamins</span>
              <span><strong>Vegan</strong></span>
              <span>Made in <strong>Belgium</strong></span>
            </div>
          </div>

          <div style="flex: 1 1 400px; min-width: 0; background: #FFFFFF; border: 3px solid #10204A; border-radius: 32px; box-shadow: 0 10px 0 #10204A; padding: 32px; display: flex; flex-direction: column; gap: 18px">
            <div style="border-radius: 20px; overflow: hidden; background: {{view.bg}}; aspect-ratio: 1 / 1; max-height: 420px; display: flex; align-items: center; justify-content: center">
              <img class="q-pop" src="{{view.img}}" alt="{{view.alt}}" style="width: 100%; height: 100%; object-fit: contain; display: block">
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px">
              <span style="font-family: Fredoka, sans-serif; font-weight: 700; font-size: 54px; line-height: 1">€24.50</span>
              <span style="font-size: 16px; font-weight: 500">16 sachets · €41.50 with a 1.2 L bottle</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: #E7F8EE; border: 2px solid #136B3A; color: #0E4F2B; border-radius: 16px; padding: 14px 16px">
              <span style="font-weight: 700; font-size: 16px">SLUMP5 unlocked: [discount] off your first pack</span>
              <button type="button" onClick="{{copyCode}}" style="font: inherit; cursor: pointer; background: #136B3A; color: #FFFFFF; border: 0; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 999px">{{copyLabel}}</button>
            </div>
            <button type="button" onClick="{{goCheckout}}" style="font: inherit; cursor: pointer; border: 0; background: #10204A; color: #FFFFFF; font-weight: 700; font-size: 20px; padding: 20px 28px; border-radius: 999px">Get my Energy Starter Pack</button>
            <div style="display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; font-weight: 500">
              <span>30-day flavour guarantee, money back</span>
              <span>Offer ends 31 March · <strong>{{daysLeft}}</strong></span>
              <span><strong>4.77/5</strong> · 7,000+ reviews</span>
            </div>
          </div>
        </div>

        <!-- hesitation exit → Q&A -->
        <button type="button" onClick="{{goFaq}}" style="font: inherit; cursor: pointer; text-align: left; background: rgba(255, 255, 255, 0.55); color: #10204A; border: 2px solid #10204A; border-radius: 24px; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
          <span style="display: flex; align-items: center; gap: 16px">
            <img src="images/ollo-sleepy.png" alt="" aria-hidden="true" style="width: 64px; height: 64px; object-fit: contain; flex: none">
            <span style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 22px">Still got a few questions before you beat the slump?</span>
              <span style="font-size: 16px">Taste, caffeine, sugar, subscriptions: it's all in our Q&amp;A.</span>
            </span>
          </span>
          <span style="background: #10204A; color: #FFFFFF; font-weight: 700; font-size: 16px; padding: 14px 20px; border-radius: 999px; display: flex; align-items: center; gap: 8px">Go to the Q&amp;A
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
          </span>
        </button>
      </div>
    </section>
  </sc-if>

  <!-- ================= SCREEN 4: Q&A ================= -->
  <sc-if value="{{isFaq}}" hint-placeholder-val="{{ false }}">
    <section class="q-in" style="flex: 1 0 auto; background: #DFF4FF">
      <div style="max-width: 860px; margin: 0 auto; padding: 56px 20px 80px; display: flex; flex-direction: column; gap: 24px">
        <button type="button" onClick="{{goPack}}" style="font: inherit; cursor: pointer; align-self: flex-start; background: transparent; border: 0; color: #10204A; font-weight: 700; font-size: 15px; text-decoration: underline; padding: 10px 0">Back to my pack</button>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="color: #0A6FB0; font-weight: 700; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase">Q&amp;A</span>

  }

    // ---- source ----
    var src = this.props.source ?? 'Instagram Reel';
    var sourceLine = src === 'Campus booth QR'
      ? 'Tasted it at the 2 PM Slump Station? Get Ollo’s secret energy drink risk-free with code SLUMP5.'
      : 'Try Ollo’s secret energy drink risk-free with code SLUMP5 · 30-day flavour guarantee';

    // ---- countdown ----
    var days = Math.ceil((new Date(2027, 2, 31, 23, 59, 59) - new Date()) / 86400000);
    var daysLeft = days > 1 ? days + ' days left' : (days === 1 ? 'last day' : 'offer ended');

    // ---- FAQ ----
    var FAQ = [
      { q: 'What if I don’t like the taste?', a: 'Your first Starter Pack comes with a 30-day flavour guarantee. Not for you? Ask for a refund within 30 days of purchase, fill in a short survey and you get your €24.50 back (minus any discount) on your original payment method.' },
      { q: 'What’s in the Energy Starter Pack?', a: '16 sachets: 4 each of Tropical Fruits, Wild Berries, Lemon Lime and Watermelon. You can order it with or without a 1.2 L Qalloo bottle.' },
      { q: 'How much caffeine is in it?', a: '80 mg of natural caffeine per sachet, from guarana, green tea and Siberian ginseng. That’s about the same as a large cup of coffee.' },
      { q: 'How do I use it?', a: 'Mix one sachet (5 g) with 750 ml of water and shake. Less water gives a stronger taste. Prefer sparkling? Mix the powder with about 100 ml of still water first, then top up.' },
      { q: 'Is there sugar in it?', a: 'No. It’s sugar-free and around 7 kcal a serving, sweetened with sucralose. Also vegan, with natural flavours and no artificial colourings or preservatives.' },
      { q: 'Who shouldn’t drink it?', a: 'Qalloo Energy is for adults: max one serving a day. Not for under-18s or pregnant or breastfeeding women. Don’t take it on an empty stomach or on the same day as other green tea products.' },
      { q: 'Do I get stuck in a subscription?', a: 'No. The Starter Pack is a one-off order and can’t be put on a subscription. If you like it, you can subscribe to bigger packs later for 15% off.' },
      { q: 'How fast is delivery?', a: 'Orders ship from Kontich, usually within 24 hours. Standard delivery in Belgium is €4.95, free from €49. Express (1–2 working days) is €8.95.' }
    ];
    var faqs = FAQ.map(function (f, i) {
      var open = s.faq === i;
      return Object.assign({}, f, { open: open, expanded: open ? 'true' : 'false', sign: open ? '−' : '+',
        toggle: function () { self.setState({ faq: open ? -1 : i }); } });
    });

    // ---- bottom bar: always the next step ----
    var barText, barCta, barGo;
    var shakeFn = function () { self.setState({ energy: Math.min(100, s.energy + 22), flip: !s.flip }); };
    if (s.screen === 'wake' && !awake) { barText = 'Ollo’s battery: ' + e + '%. Help him out?'; barCta = 'Shake'; barGo = shakeFn; }
    else if (s.screen === 'wake') { barText = 'Ollo’s awake and wants to say thanks.'; barCta = 'Get Ollo’s secret'; barGo = goTo('quiz'); }
    else if (s.screen === 'quiz' && !quizDone) { barText = 'Question ' + (qi + 1) + ' of 3 · code SLUMP5 at the end'; barCta = 'Back to Ollo'; barGo = goTo('wake'); }
    else if (s.screen === 'quiz') { barText = result.name + ' · SLUMP5 unlocked'; barCta = 'See my pack'; barGo = goTo('pack'); }
    else if (s.screen === 'pack') { barText = flavour + ' · €24.50 · SLUMP5'; barCta = 'Get my pack'; barGo = goTo('checkout'); }
    else if (s.screen === 'faq') { barText = 'Not sure yet? 30-day flavour guarantee.'; barCta = 'Try it risk-free'; barGo = goTo('checkout'); }
    else { barText = 'Energy Starter Pack · SLUMP5 applied'; barCta = 'Go to checkout'; barGo = function () {}; }

    return {
      isWake: s.screen === 'wake', isQuiz: s.screen === 'quiz', isPack: s.screen === 'pack',
      isFaq: s.screen === 'faq', isCheckout: s.screen === 'checkout',
      goWake: goTo('wake'), goQuiz: goTo('quiz'), goPack: goTo('pack'), goFaq: goTo('faq'), goCheckout: goTo('checkout'),

      sourceLine: sourceLine, timeLine: timeLine,
      clockBg: awake ? '#10204A' : (slump ? '#FF5B6E' : 'rgba(255,255,255,0.18)'),
      clockFg: awake ? '#FFD84D' : (slump ? '#10204A' : '#FFFFFF'),
      headline: headline, subline: subline,
      heroBg: awake ? '#FFD84D' : this.mix('#22306A', '#4A5FA8', t),
      heroFg: awake ? '#10204A' : '#FFFFFF',
      haloBg: awake ? '#FFFFFF' : this.mix('#2E3F82', '#8FD8FF', t),
      asleep: !awake, awake: awake,
      energy: e, energyPct: e + '%',
      meterColor: e < 40 ? '#FF5B6E' : (e < 100 ? '#FF9A5B' : '#136B3A'),
      olloImg: awake ? BLOB.energy : BLOB.sleepy,
      olloAlt: awake ? 'Energy Ollo, bright yellow and wide awake' : 'Sleepy Ollo, slumped and yawning',
      olloClass: awake ? 'q-awake' : (s.energy > 12 ? (s.flip ? 'q-shakeA' : 'q-shakeB') : ''),
      bottleClass: !awake && s.energy > 12 ? (s.flip ? 'q-shakeB' : 'q-shakeA') : '',
      olloFilter: awake ? 'none' : 'saturate(' + (0.45 + 0.55 * t).toFixed(2) + ') brightness(' + (0.85 + 0.15 * t).toFixed(2) + ')',
      liquidH: Math.round(150 * Math.max(0.15, t)),
      liquidY: 220 - Math.round(150 * Math.max(0.15, t)),
      liquidColor: this.mix('#CFEFFF', '#FFC233', t),
      shakeLabel: e <= 12 ? 'Shake to wake Ollo' : 'Keep shaking (' + shakesLeft + ' more)',
      shake: shakeFn,

      quizTitle: quizDone ? 'Ollo’s secret, matched to you.' : 'Ollo’s about to share his secret.',
      quizOpen: !quizDone, quizDone: quizDone,
      qNum: qi + 1, qProgress: Math.round(((qi + 1) / 3) * 100) + '%',
      question: question,
      backLabel: qi > 0 ? 'Previous question' : 'Back to Ollo',
      back: function () { if (qi === 0) { self.go('wake'); } else { self.setState({ q: qi - 1, answers: s.answers.slice(0, qi - 1) }); } },
      restartQuiz: function () { self.setState({ q: 0, answers: [], copied: false, viewFlav: null }); },
      result: result, swapLine: SWAP[s.answers[1]] || SWAP.none, flavour: flavour,

      flavourTabs: flavourTabs, view: view, viewIsOther: viewId !== matchId,
      matchImg: PACK[matchId].img, matchBg: PACK[matchId].bg, comboImg: PACK.all.img,
      backToMatch: function () { self.setState({ viewFlav: null }); },
      copyLabel: s.copied ? 'Copied' : 'Copy code',
      copyCode: function () { try { navigator.clipboard.writeText('SLUMP5'); } catch (err) {} self.setState({ copied: true }); },
      daysLeft: daysLeft,

      faqs: faqs,
      shareLabel: s.shared ? 'Link copied, go tag them' : 'Share my ' + result.name + ' result',
      share: function () { try { navigator.clipboard.writeText('[campaign landing page URL]'); } catch (err) {} self.setState({ shared: true }); },

      steps: steps,
      barText: barText, barCta: barCta, barGo: barGo
    };
  }
}
</script>
<script>
// ---- page settings from the link: ?src=tiktok | ?src=booth  and  ?time=14:05 for demos ----
(function () {
  var q = new URLSearchParams(location.search);
  var srcMap = { instagram: 'Instagram Reel', tiktok: 'TikTok', booth: 'Campus booth QR' };
  var props = { source: srcMap[(q.get('src') || '').toLowerCase()] || 'Instagram Reel', clock: q.get('time') || 'Live' };
  window.__mount(Component, props);
})();
</script>
</body>
